name: CI

on:
  push:
    branches: [main, '1.x']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
        include:
          # The library ships no extensions, so it has to be proven on Windows
          # and macOS too — symlink handling and rename() semantics differ.
          - os: windows-latest
            php: '8.3'
          - os: macos-latest
            php: '8.3'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpstan analyse --no-progress

  no-optional-extensions:
    name: Runs without ext-intl and ext-posix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Disable exactly the two extensions the library probes for, and
          # nothing else — a stripped-down PHP would break Composer itself
          # and prove nothing about php-fts.
          extensions: :intl, :posix
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Assert the probed extensions really are absent
        run: |
          php -r 'if (class_exists("Normalizer")) { fwrite(STDERR, "ext-intl is present, this job proves nothing\n"); exit(1); }'
          php -r 'if (function_exists("posix_kill")) { fwrite(STDERR, "ext-posix is present, this job proves nothing\n"); exit(1); }'

      # Tests needing posix_kill declare it and skip; everything else must pass.
      - name: Run tests
        run: vendor/bin/phpunit
